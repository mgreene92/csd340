<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSD 340 Web Development with HTML and CSS</title>
<meta name="robots" content="nofollow">
<meta name="description" content="Assignment 10.3: JavaScript - Part 2">
<meta name="keywords" content="HTML,CSS,CSD340">
<meta name="author" content="Meghan-Greene">
<link href="../site.css" type="text/css" rel="stylesheet">
    <script>
        function changeImage() {
            var image = document.getElementById("BallerinaPainting");
            var message = document.getElementById("message");

            if (image.src.includes("Ballerina_Unfinished.jpeg")) {
                image.src = "Ballerina_Finished.jpeg";
                message.innerHTML =
                    "The painting is complete! Click the image again to return to the unfinished version.";
            } else {
                image.src = "Ballerina_Unfinished.jpeg";
                message.innerHTML =
                    "This is the painting in the first stage. Click the image to see the finished result.";
            }
        }
    </script>
</head>

<body>

    <h1>Assignment 10.3: JavaScript - Part 2</h1>

    <h3>Click the image to view the transformation</h3>

    <img
        id="BallerinaPainting"
        src="Ballerina_Unfinished.jpeg"
        alt="Ballerina Painting"
        onclick="changeImage()">

    <p id="message">
        This is the painting in the first stage. Click the image to see the finished result.
    </p>

</body>
</html>
</html>
